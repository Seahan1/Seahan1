name: OLED GitHub stats

on:
  # 每天北京时间 00:00 更新
  schedule: [{ cron: "0 16 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure OLED card
        run: |
          cat > "$RUNNER_TEMP/cool-readme.yml" <<'YAML'
          user: Seahan1
          show: [summary]
          count:
            private: false
          look:
            style: oled
            color: green
            background: '070d09'
          YAML

      - uses: pedrocatalao/github-cool-readme@909e532bf5d2847b26d156b91c0d086e6e7781ae # v1.8.1
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config: ${{ runner.temp }}/cool-readme.yml
          output: ${{ runner.temp }}/cool-readme

      - name: Publish OLED GitHub stats
        run: |
          cp "$RUNNER_TEMP/cool-readme/summary-dark.svg" github-metrics.svg
          git add -- github-metrics.svg
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update OLED GitHub stats'
          git push

